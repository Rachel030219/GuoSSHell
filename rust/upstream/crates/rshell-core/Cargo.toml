[package]
name = "rshell-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
async-channel = "2.5"
async-trait = "0.1"
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive", "rc"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
