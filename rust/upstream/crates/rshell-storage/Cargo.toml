[package]
name = "rshell-storage"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
test-support = []

[dependencies]
async-trait = "0.1"
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
rshell-core = { path = "../rshell-core" }
rshell-platform = { path = "../rshell-platform" }
rusqlite = { version = "0.37", features = ["bundled"] }
secrecy = "=0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1.23.0", features = ["v4"] }
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

# [GuoSSHell 改动] keyring 4.1.5 的 v1 feature 在 iOS 上只启用
# apple-native-keyring-store/keychain，而 iOS 没有 legacy keychain，只有
# protected data store。不打开这个 feature 会直接编译失败：
#   error: The `protected` feature is required on iOS
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["protected"] }
