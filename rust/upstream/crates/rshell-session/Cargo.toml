[package]
name = "rshell-session"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
alacritty_terminal = "=0.26.0"
async-channel = "2.5"
async-trait = "0.1"
libc = "0.2"
# WHY: upstream 0.9's Windows INHERIT_CURSOR DSR can deadlock; this API-compatible fork removes it.
portable-pty = { package = "portable-pty-psmux", version = "=0.9.6" }
regex = "1.11"
rshell-core = { path = "../rshell-core" }
rshell-platform = { path = "../rshell-platform" }
rshell-storage = { path = "../rshell-storage" }
# Keep russh on its supported ring backend: aws-lc needs NASM on Windows and is not otherwise
# required by rsHell's managed SSH feature set.
russh = { version = "=0.62.5", default-features = false, features = ["flate2", "ring", "rsa"] }
secrecy = "0.10.3"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2.2"

[dev-dependencies]
portable-pty = { package = "portable-pty-psmux", version = "=0.9.6", features = ["containment-test-support"] }
rshell-platform = { path = "../rshell-platform", features = ["containment-test-support"] }
sha2 = "0.10.9"
tempfile = "3.23"
tokio = { version = "1", features = ["net", "test-util"] }

[[bin]]
name = "pty_echo"
path = "tests/fixtures/pty_echo.rs"
test = false
bench = false

[[bin]]
name = "rshell-qa-askpass"
path = "tests/fixtures/qa_askpass.rs"
test = false
bench = false

[[bin]]
name = "rshell-p0-tui"
path = "tests/fixtures/p0_tui.rs"
test = false
bench = false

[[bin]]
name = "rshell-interrupt-tui"
path = "tests/fixtures/interrupt_tui.rs"
test = false
bench = false

[[bin]]
name = "rshell-p0-shell"
path = "tests/fixtures/p0_shell.rs"
test = false
bench = false

[[bench]]
name = "terminal_engine"
harness = false
